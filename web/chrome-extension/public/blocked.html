<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>url.vet 拦截了这个页面</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="pages.css" />
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <main class="blocked">
      <span id="mark"></span>
      <p class="eyebrow">加载前就被拦下了</p>
      <h1>url.vet 发现这个页面<em>很危险</em>。</h1>
      <p class="why">
        它之前被检查过，判定为危险，所以在再次加载前被拦下了。这类页面往往想窃取
        密码和银行卡信息，或者安装恶意软件。
      </p>
      <p id="link" class="link"></p>
      <div class="actions">
        <button id="back" class="pill pill-solid" type="button">返回</button>
        <a
          id="report"
          class="pill pill-outline"
          target="_blank"
          rel="noopener noreferrer"
          >查看完整报告</a
        >
      </div>
      <p class="continue">
        确认它没问题？
        <button id="continue" class="text-btn" type="button">
          仍然继续访问此页面
        </button>
      </p>
    </main>
    <script type="module" src="blocked.js"></script>
  </body>
</html>
