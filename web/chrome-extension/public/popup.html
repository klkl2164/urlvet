<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>url.vet</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="pages.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main id="main">
      <header class="head">
        <span id="mark"></span>
        <button
          id="openSettings"
          class="icon-btn"
          type="button"
          aria-label="设置"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M10.34 3.94c.09-.54.56-.94 1.11-.94h1.1c.55 0 1.02.4 1.11.94l.15.91c.07.42.38.76.77.93.39.16.84.12 1.19-.12l.75-.54a1.13 1.13 0 0 1 1.45.12l.78.78c.39.39.44 1 .12 1.45l-.54.75c-.24.35-.28.8-.12 1.19.17.39.51.7.93.77l.91.15c.54.09.94.56.94 1.11v1.1c0 .55-.4 1.02-.94 1.11l-.91.15c-.42.07-.76.38-.93.77-.16.39-.12.84.12 1.19l.54.75c.32.45.27 1.06-.12 1.45l-.78.78c-.39.39-1 .44-1.45.12l-.75-.54a1.25 1.25 0 0 0-1.19-.12c-.39.17-.7.51-.77.93l-.15.91c-.09.54-.56.94-1.11.94h-1.1c-.55 0-1.02-.4-1.11-.94l-.15-.91a1.25 1.25 0 0 0-.77-.93 1.25 1.25 0 0 0-1.19.12l-.75.54c-.45.32-1.06.27-1.45-.12l-.78-.78a1.13 1.13 0 0 1-.12-1.45l.54-.75c.24-.35.28-.8.12-1.19a1.25 1.25 0 0 0-.93-.77l-.91-.15A1.13 1.13 0 0 1 3 12.55v-1.1c0-.55.4-1.02.94-1.11l.91-.15c.42-.07.76-.38.93-.77.16-.39.12-.84-.12-1.19l-.54-.75a1.13 1.13 0 0 1 .12-1.45l.78-.78c.39-.39 1-.44 1.45-.12l.75.54c.35.24.8.28 1.19.12.39-.17.7-.51.77-.93l.15-.91Z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
            />
          </svg>
        </button>
      </header>
      <p class="tagline">
        链接有点可疑？直接 <span class="underline">url.vet</span> 一下
      </p>

      <section id="page" class="page" aria-label="此页面"></section>

      <form id="form" class="search" novalidate>
        <input
          id="url"
          type="text"
          inputmode="url"
          autocomplete="off"
          spellcheck="false"
          placeholder="粘贴链接"
          aria-label="要检查的链接"
        />
        <button id="checkBtn" class="pill pill-solid" type="submit">
          检查
        </button>
      </form>
      <p id="formError" class="form-error" role="alert" hidden></p>

      <section id="result" class="result" aria-live="polite"></section>

      <footer class="foot">
        <span>无需账号，不做追踪。</span>
        <a id="privacy" target="_blank" rel="noopener noreferrer">隐私</a>
      </footer>
    </main>

    <section id="settings" class="settings" hidden>
      <header class="head">
        <button id="closeSettings" class="back" type="button">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.75 19.5 8.25 12l7.5-7.5"
            />
          </svg>
          返回
        </button>
        <span class="eyebrow">设置</span>
      </header>

      <label class="switch-row">
        <span class="switch-text">
          <span class="switch-title">在危险页面上警告我</span>
          <span class="switch-desc"
            >页面打开时自动检查，看起来危险就提醒你。最知名的 10,000
            个站点从不会发送；其余的也只发送地址。</span
          >
        </span>
        <input id="autoCheck" class="switch" type="checkbox" role="switch" />
      </label>
      <label class="check-row" id="warnSuspiciousRow">
        <input id="warnSuspicious" type="checkbox" />
        <span>可疑页面也提醒</span>
      </label>

      <label class="switch-row">
        <span class="switch-text">
          <span class="switch-title">保护我的密码</span>
          <span class="switch-desc"
            >在不属于安全的页面上输入密码前提醒你。</span
          >
        </span>
        <input
          id="passwordGuard"
          class="switch"
          type="checkbox"
          role="switch"
        />
      </label>

      <section class="panel">
        <h2 class="eyebrow">信任的站点</h2>
        <p class="panel-desc">
          永不检查，也不提醒。可以在这里添加，或者在警告卡片上点
          <em>信任此站点</em>。最知名的 10,000 个站点已经默认跳过，不会列在这里。
        </p>
        <ul id="trustedList" class="chips"></ul>
        <form id="trustForm" class="add-row" novalidate>
          <input
            id="trustInput"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="example.com"
            aria-label="要信任的站点"
          />
          <button class="pill pill-outline" type="submit">添加</button>
        </form>
        <p id="trustError" class="form-error" role="alert" hidden></p>
      </section>

      <fieldset class="server">
        <legend class="eyebrow">服务器</legend>
        <p class="server-desc">
          用于你自己搭建的 url.vet。保持原样即使用 url.vet。
        </p>
        <label class="field"
          ><span>API</span
          ><input id="apiBase" type="url" spellcheck="false" autocomplete="off"
        /></label>
        <label class="field"
          ><span>网站</span
          ><input
            id="siteBase"
            type="url"
            spellcheck="false"
            autocomplete="off"
        /></label>
        <div class="server-actions">
          <button id="saveServer" class="pill pill-solid" type="button">
            保存
          </button>
          <button id="resetServer" class="pill pill-outline" type="button">
            使用 url.vet
          </button>
          <button id="localServer" class="pill pill-outline" type="button">
            使用 localhost
          </button>
        </div>
        <p id="serverStatus" class="server-status" role="status"></p>
      </fieldset>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
